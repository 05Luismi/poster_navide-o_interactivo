<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ningún niño sin regalo · Fundación ITACA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="viewport">
    <div class="poster-wrap" id="posterWrap">
      <section class="poster" id="poster" aria-label="Cartel interactivo en 3D: Ningún niño sin regalo. 21 de diciembre, Fundación ITACA">

        <!-- ===== Escena 3D (Three.js · WebGL) ===== -->
        <canvas class="scene3d" id="scene3d" aria-hidden="true"></canvas>

        <!-- ===== Capa de texto ===== -->
        <div class="overlay">
          <header class="topbar">Fundación ITACA · L'Hospitalet</header>

          <h1 class="headline" id="headline" aria-label="Ningún niño sin regalo">
            <span class="line">Ningún niño</span>
            <span class="line line--gold">sin regalo</span><span class="holly" aria-hidden="true">
              <svg viewBox="0 0 100 70">
                <path d="M50,40 C40,22 22,24 8,16 C12,24 6,28 10,34 C4,38 8,44 4,50 C18,44 34,52 50,40Z" fill="#2f8a4e" stroke="#123d22" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M50,40 C30,36 20,34 9,22" fill="none" stroke="#1a5a31" stroke-width="2"/>
                <path d="M50,40 C60,22 78,24 92,16 C88,24 94,28 90,34 C96,38 92,44 96,50 C82,44 66,52 50,40Z" fill="#3a9d5c" stroke="#123d22" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M50,40 C70,36 80,34 91,22" fill="none" stroke="#1a5a31" stroke-width="2"/>
                <circle cx="43" cy="47" r="8" fill="#d42a33" stroke="#5e0b12" stroke-width="2"/>
                <circle cx="57" cy="47" r="8" fill="#c0262f" stroke="#5e0b12" stroke-width="2"/>
                <circle cx="50" cy="35" r="8" fill="#e0353e" stroke="#5e0b12" stroke-width="2"/>
                <circle cx="47" cy="32" r="2.4" fill="#fff" opacity=".8"/>
                <circle cx="40" cy="44" r="2.2" fill="#fff" opacity=".7"/>
                <circle cx="54" cy="44" r="2.2" fill="#fff" opacity=".7"/>
              </svg>
            </span>
          </h1>

          <div class="message">
            <p class="quote">Dentro de cada <span class="kw" data-fx="shake">regalo</span> hay una <em class="kw" data-fx="smile">sonrisa</em>.</p>
          </div>

          <div class="badge" id="badge" role="button" tabindex="0" aria-label="Dona 10 euros: regala un juguete">
            <svg class="badge-ring" id="badgeRing" viewBox="0 0 160 160" aria-hidden="true">
              <defs><path id="ringPath" d="M80,80 m-62,0 a62,62 0 1,1 124,0 a62,62 0 1,1 -124,0"/></defs>
              <text><textPath href="#ringPath">DONA ✦ REGALA ✦ ILUSIONA ✦ DONA ✦ REGALA ✦ ILUSIONA ✦</textPath></text>
            </svg>
            <div class="badge-core" id="badgeCore">
              <span class="badge-big">10€</span>
              <span class="badge-small">= 1 regalo</span>
            </div>
            <span class="badge-count" id="badgeCount" aria-live="polite"></span>
          </div>

          <div class="tooltip" id="tooltip"></div>

          <footer class="footer">
            <div class="f-date">
              <p class="f-day"><span class="date-num" id="dateNum">21</span> <em>de diciembre</em></p>
              <p class="f-sub">Campaña Juguete Solidario<br>#NingúnNiñoSinRegalo</p>
            </div>

            <div class="brand">
              <img class="brand-itaca" id="logo" src="img/itaca-logo-morado.png" alt="Associació educativa Itaca">
              <img class="brand-planeta" id="logoPlaneta" src="img/planetafp-logo.png" alt="Planeta FP">

              <svg class="seal" id="seal" viewBox="0 0 100 100" width="66" height="66" aria-label="Sello Juguete Solidario">
                <defs><path id="sealPath" d="M50,50 m-36,0 a36,36 0 1,1 72,0 a36,36 0 1,1 -72,0"/></defs>
                <circle cx="50" cy="50" r="47" fill="#fbf7f0" stroke="#3a2a1e" stroke-width="2"/>
                <circle cx="50" cy="50" r="26" fill="#c0262f"/>
                <text font-size="9.6" font-family="Inter, Arial, sans-serif" font-weight="800" fill="#3a2a1e" letter-spacing="0.6">
                  <textPath href="#sealPath">JUGUETE SOLIDARIO · NAVIDAD 2026 · </textPath>
                </text>
                <path d="M50,35 L54,46 L65,46 L56,53 L59,64 L50,57 L41,64 L44,53 L35,46 L46,46Z" fill="#e8b23a"/>
              </svg>
            </div>
          </footer>
        </div>

        <!-- Cursor, viñeta y grano -->
        <div class="vignette" aria-hidden="true"></div>
        <div class="cursor" id="cursor" aria-hidden="true">
          <svg viewBox="-20 -20 40 40">
            <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
              <path d="M0,-17 V17 M-14.7,-8.5 L14.7,8.5 M-14.7,8.5 L14.7,-8.5"/>
              <path d="M-4,-13 L0,-9 L4,-13 M-4,13 L0,9 L4,13"/>
            </g>
            <circle r="3.5" fill="#ffd27a"/>
          </svg>
        </div>
        <div class="grain" aria-hidden="true"></div>
        <div class="loading" id="loading">Preparando la escena…</div>
      </section>
    </div>
  </main>

  <script src="lib/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
